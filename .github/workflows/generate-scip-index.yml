name: Generate SCIP Index

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to index"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Show branch and commit
        run: |
          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

      - name: Show .NET environment
        run: |
          dotnet --info

      - name: Install scip-dotnet
        run: |
          dotnet tool install --global scip-dotnet

      - name: Verify scip-dotnet
        run: |
          scip-dotnet --version

      - name: Find .NET solution
        id: dotnet
        shell: bash
        run: |
          SOLUTION=$(find . \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            -name "*.sln" \
            | head -n 1)

          if [ -z "$SOLUTION" ]; then
            PROJECT=$(find . \
              -not -path "./.git/*" \
              -not -path "./.aava/*" \
              \( -name "*.csproj" -o -name "*.vbproj" \) \
              | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "No .NET solution or project found"
              exit 1
            fi

            echo "target=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "root=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"
          else
            echo "target=$SOLUTION" >> "$GITHUB_OUTPUT"
            echo "root=$(dirname "$SOLUTION")" >> "$GITHUB_OUTPUT"
          fi

      - name: Show selected .NET target
        run: |
          echo "Target: ${{ steps.dotnet.outputs.target }}"
          echo "Root:   ${{ steps.dotnet.outputs.root }}"

      - name: Restore dependencies
        run: |
          dotnet restore "${{ steps.dotnet.outputs.target }}"

      - name: Generate SCIP index
        working-directory: ${{ steps.dotnet.outputs.root }}
        run: |
          scip-dotnet index

      - name: Verify generated index
        shell: bash
        run: |
          INDEX="${{ steps.dotnet.outputs.root }}/index.scip"

          if [ ! -f "$INDEX" ]; then
            echo "index.scip was not generated"
            exit 1
          fi

          echo "Generated SCIP index:"
          ls -lh "$INDEX"

      - name: Move index to .aava
        shell: bash
        run: |
          mkdir -p .aava

          cp \
            "${{ steps.dotnet.outputs.root }}/index.scip" \
            ".aava/index.scip"

      - name: Create metadata
        shell: bash
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)

          cat > .aava/index-metadata.json <<EOF
          {
            "branch": "${{ inputs.branch }}",
            "sourceCommitSha": "$SOURCE_SHA",
            "indexer": "scip-dotnet",
            "indexPath": ".aava/index.scip"
          }
          EOF

      - name: Commit SCIP index
        shell: bash
        run: |
          git config user.name "aava-indexer"
          git config user.email "aava-indexer@users.noreply.github.com"

          git add .aava/index.scip .aava/index-metadata.json

          if git diff --cached --quiet; then
            echo "No index changes to commit"
            exit 0
          fi

          git commit -m "chore(aava): refresh SCIP code index"

          git push origin HEAD:${{ inputs.branch }}
