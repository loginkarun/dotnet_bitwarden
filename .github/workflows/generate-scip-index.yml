name: Generate SCIP Index

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to index"
        required: true
        default: "main"
        type: string

jobs:
  generate-scip:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Verify branch
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse HEAD

      - name: Show .NET information
        run: |
          dotnet --info

      - name: Install scip-dotnet
        run: |
          dotnet tool install --global scip-dotnet

      - name: Verify scip-dotnet
        run: |
          scip-dotnet --version

      - name: Find solution or project
        id: dotnet
        shell: bash
        run: |
          echo "Looking for .NET solution/project files..."

          # Prefer the known Bitwarden solution manifest
          if [ -f "bitwarden-server.slnx" ]; then
            echo "Found bitwarden-server.slnx"

            echo "target=bitwarden-server.slnx" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # Otherwise find nearest .sln or .slnx
          SOLUTION=$(find . \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            \( -name "*.sln" -o -name "*.slnx" \) \
            -print 2>/dev/null \
            | head -n 1)

          if [ -n "$SOLUTION" ]; then
            echo "Selected solution: $SOLUTION"

            echo "target=$SOLUTION" >> "$GITHUB_OUTPUT"
            echo "root=$(dirname "$SOLUTION")" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "No .sln or .slnx found. Looking for project files..."

          PROJECT=$(find . \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            \( -name "*.csproj" -o -name "*.vbproj" \) \
            -print 2>/dev/null \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .sln, .slnx, .csproj, or .vbproj found"
            exit 1
          fi

          echo "Selected project: $PROJECT"

          echo "target=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "root=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Show selected .NET target
        run: |
          echo "Restore target:"
          echo "${{ steps.dotnet.outputs.target }}"

          echo "Index root:"
          echo "${{ steps.dotnet.outputs.root }}"

      - name: Restore .NET dependencies
        run: |
          dotnet restore "${{ steps.dotnet.outputs.target }}"

      - name: Generate SCIP index
        shell: bash
        run: |
          echo "Repository root:"
          pwd

          echo "Selected index root:"
          echo "${{ steps.dotnet.outputs.root }}"

          echo "Available solution/project files:"
          find . \
            -maxdepth 3 \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            \( \
              -name "*.sln" \
              -o -name "*.slnx" \
              -o -name "*.csproj" \
              -o -name "*.vbproj" \
            \) \
            -print

          scip-dotnet index \
            --working-directory "${{ steps.dotnet.outputs.root }}"

      - name: Locate generated index.scip
        id: scip
        shell: bash
        run: |
          echo "Searching for generated index.scip..."

          INDEX=$(find . \
            -not -path "./.git/*" \
            -name "index.scip" \
            -print \
            | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.scip was not generated"
            exit 1
          fi

          echo "SCIP index found:"
          echo "$INDEX"

          ls -lh "$INDEX"

          echo "index=$INDEX" >> "$GITHUB_OUTPUT"

      - name: Upload SCIP index
        uses: actions/upload-artifact@v4
        with:
          name: index-scip
          path: ${{ steps.scip.outputs.index }}
          if-no-files-found: error
