name: Generate SCIP Index

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to index"
        required: true
        default: "main"
        type: string

jobs:
  generate-scip:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Verify branch
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse HEAD

      - name: Show .NET information
        run: |
          dotnet --info

      - name: Install scip-dotnet
        run: |
          dotnet tool install --global scip-dotnet

      - name: Verify scip-dotnet
        run: |
          scip-dotnet --version

      - name: Find solution
        id: dotnet
        shell: bash
        run: |
          echo "Looking for solution files..."

          find . \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            -name "*.sln" \
            -print

          SOLUTION=$(find . \
            -not -path "./.git/*" \
            -not -path "./.aava/*" \
            -name "*.sln" \
            -print \
            | head -n 1)

          if [ -z "$SOLUTION" ]; then
            echo "No .sln found. Looking for .csproj..."

            PROJECT=$(find . \
              -not -path "./.git/*" \
              -not -path "./.aava/*" \
              -name "*.csproj" \
              -print \
              | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: No .sln or .csproj found"
              exit 1
            fi

            echo "target=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "root=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

          else
            echo "Selected solution: $SOLUTION"

            echo "target=$SOLUTION" >> "$GITHUB_OUTPUT"
            echo "root=$(dirname "$SOLUTION")" >> "$GITHUB_OUTPUT"
          fi

      - name: Show selected project
        run: |
          echo "Restore target:"
          echo "${{ steps.dotnet.outputs.target }}"

          echo "Index root:"
          echo "${{ steps.dotnet.outputs.root }}"

      - name: Restore .NET dependencies
        run: |
          dotnet restore "${{ steps.dotnet.outputs.target }}"

      - name: Generate SCIP index
        working-directory: ${{ steps.dotnet.outputs.root }}
        run: |
          echo "Running SCIP from:"
          pwd

          scip-dotnet index

          echo "Directory contents after indexing:"
          ls -lah

      - name: Verify index.scip
        shell: bash
        run: |
          INDEX="${{ steps.dotnet.outputs.root }}/index.scip"

          echo "Expected SCIP index:"
          echo "$INDEX"

          if [ ! -f "$INDEX" ]; then
            echo "ERROR: index.scip was not generated"
            exit 1
          fi

          echo "SCIP index successfully generated"

          ls -lh "$INDEX"

      - name: Upload SCIP index
        uses: actions/upload-artifact@v4
        with:
          name: index-scip
          path: ${{ steps.dotnet.outputs.root }}/index.scip
          if-no-files-found: error
