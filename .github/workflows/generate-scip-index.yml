name: Generate SCIP Index

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to index"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Show branch and commit
        run: |
          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

      - name: Show .NET environment
        run: |
          dotnet --info

      - name: Install scip-dotnet
        run: |
          dotnet tool install --global scip-dotnet

      - name: Verify scip-dotnet
        run: |
          scip-dotnet --version
